name: trend-buddy

services:
  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/api-gateway/cmd/api-gateway
        SERVICE_BINARY: api-gateway
    env_file:
      - config/generated/dev.env
    ports:
      - "8080:8080"
    depends_on:
      - database-service
      - data-ingestion
      - broker-gateway
      - indicator-engine
      - live-runner
      - backtesting
      - strategy-engine
      - portfolio-analytics

  database-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/database-service/cmd/database-service
        SERVICE_BINARY: database-service
    env_file:
      - config/generated/dev.env
    ports:
      - "8083:8083"
    volumes:
      - db-data:/app/db

  data-ingestion:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/data-ingestion/cmd/data-ingestion
        SERVICE_BINARY: data-ingestion
    env_file:
      - config/generated/dev.env
    ports:
      - "8084:8084"
    depends_on:
      - database-service
      - broker-gateway

  broker-gateway:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/broker-gateway/cmd/broker-gateway
        SERVICE_BINARY: broker-gateway
    env_file:
      - config/generated/dev.env
    ports:
      - "8085:8085"
    depends_on:
      - database-service

  indicator-engine:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/indicator-engine/cmd/indicator-engine
        SERVICE_BINARY: indicator-engine
    env_file:
      - config/generated/dev.env
    ports:
      - "8086:8086"
    depends_on:
      - database-service

  live-runner:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/live-runner/cmd/live-runner
        SERVICE_BINARY: live-runner
    env_file:
      - config/generated/dev.env
    ports:
      - "8087:8087"
    depends_on:
      - database-service
      - data-ingestion
      - broker-gateway
      - strategy-engine

  backtesting:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PACKAGE: trend-buddy-backtesting
        SERVICE_MODULE: backtesting.main
    env_file:
      - config/generated/dev.env
    ports:
      - "8090:8090"
    depends_on:
      - database-service
      - indicator-engine
      - strategy-engine

  strategy-engine:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PACKAGE: trend-buddy-strategy-engine
        SERVICE_MODULE: strategy_engine.main
    env_file:
      - config/generated/dev.env
    ports:
      - "8091:8091"

  portfolio-analytics:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PACKAGE: trend-buddy-portfolio-analytics
        SERVICE_MODULE: portfolio_analytics.main
    env_file:
      - config/generated/dev.env
    ports:
      - "8092:8092"
    depends_on:
      - database-service
      - broker-gateway
      - live-runner

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - config/generated/dev.env
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  db-data:
