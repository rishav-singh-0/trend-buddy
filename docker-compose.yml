name: trend-buddy

services:
  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/api-gateway/cmd/api-gateway
        SERVICE_BINARY: api-gateway
    env_file:
      - config/generated/dev.env
    ports:
      - "8080:8080"

  database-service:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/database-service/cmd/database-service
        SERVICE_BINARY: database-service
    env_file:
      - config/generated/dev.env
    ports:
      - "8083:8083"
    volumes:
      - db-data:/app/db

  indicator-engine:
    build:
      context: .
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE_PATH: services/indicator-engine/cmd/indicator-engine
        SERVICE_BINARY: indicator-engine
    env_file:
      - config/generated/dev.env
    ports:
      - "8086:8086"

  backtesting:
    build:
      context: .
      dockerfile: infra/docker/python-service.Dockerfile
      args:
        SERVICE_PACKAGE: trend-buddy-backtesting
        SERVICE_MODULE: backtesting.main
    env_file:
      - config/generated/dev.env
    ports:
      - "8090:8090"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - config/generated/dev.env
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  db-data:
