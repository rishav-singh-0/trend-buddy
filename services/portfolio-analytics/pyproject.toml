[project]
name = "trend-buddy-portfolio-analytics"
version = "0.1.0"
description = "Portfolio analytics service for Trend Buddy."
requires-python = ">=3.12"
dependencies = ["trend-buddy-shared"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_analytics"]
